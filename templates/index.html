<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipFetch — Instagram Reels & YouTube Downloader</title>
    <meta name="description" content="Download Instagram Reels and YouTube videos in HD. Paste a link, pick quality, save.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="bg-atmosphere" aria-hidden="true">
        <div class="bg-blob bg-blob--one"></div>
        <div class="bg-blob bg-blob--two"></div>
        <div class="bg-grid"></div>
    </div>

    <main class="shell">
        <header class="brand reveal">
            <p class="brand__mark">ClipFetch</p>
            <h1 class="brand__headline">Save Reels &amp; videos in one tap</h1>
            <p class="brand__sub">Paste an Instagram Reel or YouTube link. Choose quality. Download.</p>
        </header>

        <section class="downloader reveal reveal--delay" aria-label="Download form">
            <div class="platforms" role="list">
                <span class="platform" role="listitem">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.9.2 2.4.4.6.2 1 .5 1.5 1 .4.4.7.9 1 1.5.2.5.4 1.2.4 2.4.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.2 1.9-.4 2.4-.2.6-.5 1-1 1.5-.4.4-.9.7-1.5 1-.5.2-1.2.4-2.4.4-1.3.1-1.7.1-4.9.1s-3.6 0-4.9-.1c-1.2-.1-1.9-.2-2.4-.4-.6-.2-1-.5-1.5-1-.4-.4-.7-.9-1-1.5-.2-.5-.4-1.2-.4-2.4C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.9c.1-1.2.2-1.9.4-2.4.2-.6.5-1 1-1.5.4-.4.9-.7 1.5-1 .5-.2 1.2-.4 2.4-.4C8.4 2.2 8.8 2.2 12 2.2zm0 1.8c-3.1 0-3.5 0-4.7.1-1.1.1-1.7.2-2.1.4-.5.2-.8.4-1.1.7-.3.3-.5.6-.7 1.1-.2.4-.3 1-.4 2.1-.1 1.2-.1 1.6-.1 4.7s0 3.5.1 4.7c.1 1.1.2 1.7.4 2.1.2.5.4.8.7 1.1.3.3.6.5 1.1.7.4.2 1 .3 2.1.4 1.2.1 1.6.1 4.7.1s3.5 0 4.7-.1c1.1-.1 1.7-.2 2.1-.4.5-.2.8-.4 1.1-.7.3-.3.5-.6.7-1.1.2-.4.3-1 .4-2.1.1-1.2.1-1.6.1-4.7s0-3.5-.1-4.7c-.1-1.1-.2-1.7-.4-2.1-.2-.5-.4-.8-.7-1.1-.3-.3-.6-.5-1.1-.7-.4-.2-1-.3-2.1-.4-1.2-.1-1.6-.1-4.7-.1zm0 3.1a4.9 4.9 0 1 1 0 9.8 4.9 4.9 0 0 1 0-9.8zm0 1.8a3.1 3.1 0 1 0 0 6.2 3.1 3.1 0 0 0 0-6.2zm6.4-2.1a1.2 1.2 0 1 1 0 2.3 1.2 1.2 0 0 1 0-2.3z"/></svg>
                    Instagram
                </span>
                <span class="platform" role="listitem">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.5 31.5 0 0 0 0 12a31.5 31.5 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.5 31.5 0 0 0 24 12a31.5 31.5 0 0 0-.5-5.8zM9.8 15.5v-7l6.3 3.5-6.3 3.5z"/></svg>
                    YouTube
                </span>
                <span class="platform" role="listitem">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12.5 2.2 4.8 6.7v10.6l7.7 4.5 7.7-4.5V6.7L12.5 2.2zm0 2.1 5.8 3.4v.1l-5.8 3.3-5.8-3.3.1-.1 5.7-3.4zm-6.6 5 5.7 3.3v6.6l-5.7-3.3V9.3zm12.3 0v6.6l-5.7 3.3v-6.6l5.7-3.3z"/></svg>
                    Shorts
                </span>
            </div>

            {% if error %}
            <div class="alert" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/" id="download-form" class="form" novalidate>
                <label class="field">
                    <span class="field__label">Video link</span>
                    <input
                        type="url"
                        id="url"
                        name="url"
                        class="field__input"
                        placeholder="https://www.instagram.com/reel/… or youtube.com/watch?v=…"
                        autocomplete="off"
                        required
                        value="{{ url or '' }}"
                    >
                </label>

                <fieldset class="quality">
                    <legend class="field__label">Quality</legend>
                    <div class="quality__options">
                        {% for q in ['1080p', '720p', '480p', '360p', '240p'] %}
                        <label class="quality__option">
                            <input type="radio" name="quality" value="{{ q }}" {% if (quality or '720p') == q %}checked{% endif %}>
                            <span>{{ q }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </fieldset>

                <button type="submit" class="cta" id="submit-btn">
                    <span class="cta__label">Download video</span>
                    <span class="cta__spinner" aria-hidden="true"></span>
                </button>
            </form>
        </section>

        <footer class="footer reveal reveal--delay-2">
            <p>Made by Vishnu · For personal use only</p>
        </footer>
    </main>

    <script>
        const form = document.getElementById('download-form');
        const btn = document.getElementById('submit-btn');

        form.addEventListener('submit', () => {
            const url = document.getElementById('url').value.trim();
            if (!url) return;
            btn.classList.add('is-loading');
            btn.disabled = true;
            // File downloads keep the page open — reset UI after a while
            setTimeout(() => {
                btn.classList.remove('is-loading');
                btn.disabled = false;
            }, 12000);
        });
    </script>
</body>
</html>
