<!DOCTYPE html>
<html>
  <head>
    <title>All-in-One Video Downloader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1>Video & Shorts Downloader</h1>

        <form method="POST" id="download-form" onsubmit="handleFormSubmit()">
          <input
            type="text"
            name="url"
            placeholder="Paste YouTube, Shorts, or Reel URL"
            required>

          <div class="select-container">
            <select name="quality" id="quality">
              <option value="720p" selected>720p (Fastest)</option>
              <option value="best">Best Quality (1080p)</option>
              <option value="1080p">1080p</option>
              <option value="480p">480p</option>
              <option value="360p">360p</option>
              <option value="240p">240p</option>
              <option value="audio">Audio Only (MP3)</option>
            </select>
          </div>

          <button type="submit" id="btn-submit">
            <span id="btn-text">Download</span>
            <span id="btn-spinner" style="display: none;">⌛ Downloading... Please wait</span>
          </button>
        </form>

        <script>
          function handleFormSubmit() {
            const btn = document.getElementById("btn-submit");
            const btnText = document.getElementById("btn-text");
            const btnSpinner = document.getElementById("btn-spinner");
            btnText.style.display = "none";
            btnSpinner.style.display = "inline";
            setTimeout(() => { btn.disabled = true; }, 10);
          }
        </script>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <p class="note">✔ Supports YouTube, Shorts & Instagram Reels</p>
        <p class="note">Made By vishnu with &#9829;</p>
      </div>
    </div>
  </body>
</html>
